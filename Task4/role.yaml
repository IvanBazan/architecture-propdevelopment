apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: rbac-propdev
  name: user_reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: rbac-propdev
  name: user_writer
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: rbac-propdev
  name: user_admin
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]